# nginx in front of Dashy. It is the only process listening on the network: it
# asks ha-login.mjs whether each request may pass (login.conf, written by
# run.sh), blocks files that are never meant for the browser, and adds security
# headers. Dashy itself listens on the loopback address only.

user nginx;
worker_processes 1;
daemon off;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events
{
  worker_connections 256;
}

http
{
  server_tokens off;
  access_log off;
  client_max_body_size 1m;

  # Proxy apps in Home Assistant, such as NGINX Proxy Manager or Cloudflared, run
  # on the Supervisor network. Taking the visitor's address from their header
  # keeps one visitor's failed logins from locking out everyone else.
  set_real_ip_from 172.30.32.0/23;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Dashy never sees the visitor's login, which nginx has already checked. Only
  # REST API calls keep their Authorization header, with Dashy's API token.
  map $uri $dashy_authorization
  {
    ~^/api/ $http_authorization;
    default "";
  }

  upstream dashy
  {
    server 127.0.0.1:8081;
    keepalive 8;
  }

  server
  {
    listen 8080 default_server;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $dashy_authorization;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    include /run/dashy-app/login.conf;

    error_page 403 @locked;

    location @locked
    {
      auth_request off;
      default_type text/plain;
      return 403 "Too many failed logins from your address. Try again in 15 minutes.\n";
    }

    location = /_login-check
    {
      internal;
      auth_request off;
      proxy_pass http://127.0.0.1:8082;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # The Supervisor watchdog and the Docker health check have no login. They get
    # a plain "ok" once Dashy answers its own health check, which would also tell
    # anyone Dashy's version and uptime. The answer is a file, not "return":
    # return would answer before auth_request asks Dashy.
    location = /healthz
    {
      auth_request /_dashy-health;
      default_type text/plain;
      alias /opt/dashy-app/healthz.txt;
    }

    location = /_dashy-health
    {
      internal;
      auth_request off;
      proxy_read_timeout 5s;
      proxy_pass http://dashy/healthz;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    # Scripts use the REST API with Dashy's own API token; run.sh refuses to turn
    # the API on without one.
    location ^~ /api/
    {
      auth_request off;
      proxy_pass http://dashy;
    }

    location ^~ /config-backups/
    {
      return 404;
    }

    location ~ /\.
    {
      return 404;
    }

    location /
    {
      proxy_pass http://dashy;
    }
  }
}
