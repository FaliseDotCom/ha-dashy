name: Dashy
version: "4.8.7"
slug: dashy
description: A self-hosted start page for your home lab, with status checks, widgets and themes.
url: https://github.com/FaliseDotCom/ha-dashy/tree/main/dashy
homeassistant: 2026.7.0
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
timeout: 20
backup: hot
auth_api: true
map:
  - app_config:rw
ports:
  8080/tcp: 4000
webui: http://[HOST]:[PORT:8080]
watchdog: http://[HOST]:[PORT:8080]/healthz
options:
  require_login: true
  allowed_users: []
  enable_api: false
  disable_proxy_endpoints: false
  config_backups: true
schema:
  require_login: bool
  allowed_users:
    - str
  enable_api: bool
  api_token: password?
  disable_proxy_endpoints: bool
  config_backups: bool
